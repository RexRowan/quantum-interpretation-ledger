# manifest.yaml — source of truth for RESULTS.md
# status: pending | falsified | constrained | out-of-scope
# theorem: Lean theorem name once status is `falsified`, else null

- id: many-worlds
  name: "Many-Worlds (Everett)"
  class: no-collapse
  status: pending
  theorem: null
  note: "No known falsification criterion — empirically equivalent to bare unitary QM"

- id: grw
  name: "GRW (original parameters)"
  class: objective-collapse
  status: pending
  theorem: null
  note: "lambda=1e-16 s^-1 at rC=1e-7m not yet excluded (Wolf et al., STE-QUEST, arXiv:2211.15412, 2022)"

- id: csl
  name: "CSL (GRW-parameter regime)"
  class: objective-collapse
  status: pending
  theorem: null
  note: "Weak (GRW-scale) parameter regime not yet excluded; interferometric bounds ~5e-6 s^-1 at rC=1e-7m are many orders above it"

- id: csl-adler
  name: "CSL (Adler parameters)"
  class: objective-collapse
  status: falsified
  theorem: adler_csl_falsified_by_igex_xray_bound
  note: "lambda=4e-8+-2 s^-1 at rC=1e-7m excluded by IGEX X-ray bound of 6.8e-12 s^-1 (Piscicchia et al. 2017, arXiv:1710.01973); confirmed by Wolf et al. 2022, arXiv:2211.15412"

- id: diosi-penrose
  name: "Diósi–Penrose"
  class: objective-collapse-gravity
  status: pending
  theorem: null
  note: "Falsifiable via collapse-time vs. superposition mass/size experiments"

- id: local-friendliness
  name: "Extended Wigner's Friend / Local Friendliness"
  class: observer-dependent-facts
  status: constrained
  theorem: null
  note: "Literature reports violation of local-friendliness inequalities (Bong et al.); not yet a Lean theorem"

- id: bohmian
  name: "Bohmian mechanics"
  class: hidden-variables
  status: out-of-scope
  theorem: null
  note: "Empirically equivalent to standard QM; visualization only, not falsifiable by this method"
