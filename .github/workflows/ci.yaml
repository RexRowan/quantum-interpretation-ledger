name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        run: lake build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check RESULTS.md is in sync with manifest.yaml
        run: |
          cp RESULTS.md /tmp/RESULTS.before.md
          python scripts/gen_results.py
          diff -u /tmp/RESULTS.before.md RESULTS.md || {
            echo "::error::RESULTS.md is stale — run 'python scripts/gen_results.py' and commit the result.";
            exit 1;
          }
